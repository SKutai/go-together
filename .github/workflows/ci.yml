name: CI

on:
  push:
    branches:
      - main
  pull_request: {} # Run against every base branch so stacked pull requests are covered.
  workflow_dispatch: {} # A run can be started by hand on any branch, from the Actions tab.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: Native format, lint, test, docs, and build
    runs-on: ubuntu-latest
    env:
      # No debug information in this job's builds. The `dev` profile's full
      # debug information makes every binary that links Bevy over a gigabyte,
      # enough to fill the `ubuntu-24.04` runner's disk while this job links
      # a doctest. Nothing here uses it: no debugger runs and no backtrace is
      # printed, and a failing test still reports the file and line it
      # panicked at. Local builds keep the ordinary profile. The measurements
      # are in CONTRIBUTING.md's "Required checks" section.
      CARGO_PROFILE_DEV_DEBUG: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate local documentation links
        run: python3 tools/check_markdown_links.py

      # Disk space is the limit this job has run into, so every run logs what
      # it starts with here and what it has used in `Show disk use` below.
      - name: Show free disk space
        run: df -h

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install stable Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      # The cache holds downloaded crates and the dependencies' build output,
      # never this crate's own (the last steps remove that before saving). Its
      # key names what that output depends on - the compiler, the lockfile,
      # the manifest's profiles and features, and this workflow's commands and
      # environment - so a cache is only restored into a job that would build
      # the same files. There are deliberately no restore-keys: a near match
      # would leave the superseded artifacts on disk beside their rebuilt
      # replacements, which is the growth this job can least afford, and they
      # would be saved again under the new key.
      # `registry/src` is left out: Cargo unpacks what it needs again from the
      # downloaded archives in `registry/cache`, so caching it would store
      # every crate twice.
      - name: Restore Cargo and dependency build data
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-native-cargo-v5-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/ci.yml') }}

      - name: Check formatting
        run: cargo fmt --all --check

      # Each configuration this repository supports gets one Clippy run with
      # warnings denied; the two native configurations below are then tested
      # the same way. (The `web` job lints and builds the `wasm32`
      # configuration, but there is no test runner for it.) There is
      # no separate `cargo check` step beside either Clippy run - Clippy is a
      # rustc wrapper and reports the same compiler warnings, so a `cargo check`
      # over the same targets and features would only repeat it. `client` is the
      # only feature, so `--all-features` here is also the default feature set.
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Lint the headless core (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Test the headless core (no default features)
        run: cargo test --locked --no-default-features

      - name: Build private-item documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items

      - name: Build
        run: cargo build --locked

      - name: Verify generated audio
        run: python3 tools/generate_marimba.py --check

      - name: Show disk use
        if: always()
        run: |
          df -h .
          du -sh target ~/.cargo/registry

      # Saved only when nothing matched the key, and only once every step
      # above has passed, so a saved cache always holds everything this job
      # builds. A run that restored an exact match saves nothing, so a cache
      # missing something would never be replaced until the key changes.
      - name: Remove this crate's own build output before saving
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clean --package go-together
          cargo clean --doc

      # The path list must match the restore step's exactly.
      - name: Save Cargo and dependency build data
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  web:
    name: WASM and Trunk distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust with the WASM target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo and Trunk data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cache/trunk
          key: ${{ runner.os }}-wasm-trunk-0.21.14-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-trunk-0.21.14-v2-

      - name: Install Trunk 0.21.14
        run: cargo install trunk --locked --version 0.21.14

      - name: Lint the WASM build with warnings denied
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      # The native documentation build in the other job never sees the
      # `wasm32`-only items (`platform::browser_storage`, `platform::web`, and
      # `BROWSER_REPLAY_LIMIT`), so their intra-doc links are only checked here.
      - name: Build WASM private-item documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --target wasm32-unknown-unknown --no-deps --document-private-items

      - name: Build and verify the itch.io distribution
        run: scripts/build-web.sh
